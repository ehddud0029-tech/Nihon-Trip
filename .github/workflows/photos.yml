name: photos
on:
  push:
    branches: [photo-job]
    paths: ['photos.py', 'titles.json', 'search.json', 'fix.json', 'drinks.py', 'drink_search.json']
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: if [ -f drink_search.json ]; then python3 drinks.py; else python3 photos.py; fi
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add photo_cache.json photo_candidates.json; if [ -f drink_candidates.json ]; then git add drink_candidates.json; fi
          git commit -m "photo job results" || true
          git push
