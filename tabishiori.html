<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Shippori+Mincho+B1:wght@700&display=swap">
<style>
/* Layout: 여행 책자(旅のしおり) — 상단 도시 선택 + 섹션 탭, 카드 그리드, PC는 우측 서랍 / 모바일은 하단 시트와 하단 탭바 */
:root{
  --paper:#F4F5F1; --surface:#FFFFFF; --ink:#1C2433; --ink-2:#5A6272; --line:#DCDFD6;
  --ai:#23395B; --shu:#C4452C; --matsu:#3E6B48; --yamabuki:#B8860B; --ai-soft:#E6EAF1;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-kanji:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151C; --surface:#1A202A; --ink:#E7E9E3; --ink-2:#9BA3B2; --line:#2A3240;
  --ai:#9DB4DE; --shu:#E5735A; --matsu:#7FB38A; --yamabuki:#E2B64A; --ai-soft:#222C3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151C; --surface:#1A202A; --ink:#E7E9E3; --ink-2:#9BA3B2; --line:#2A3240;
  --ai:#9DB4DE; --shu:#E5735A; --matsu:#7FB38A; --yamabuki:#E2B64A; --ai-soft:#222C3C; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){body{padding-bottom:0}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--ai)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex-shrink:0}
.seal svg{width:30px;height:30px;display:block}
.seal{width:36px;height:36px;border-radius:6px;background:var(--shu);color:#fff;display:grid;place-items:center;font-family:var(--f-kanji);font-size:21px;line-height:1}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.01em}
.seal.seal-go{font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--ink-2);letter-spacing:.08em;margin-top:-2px}
nav.main{display:none;border-top:1px solid var(--line)}
.top nav.main .wrap{display:flex;gap:4px;padding-block:0;align-items:stretch}
nav.main a{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:76px;padding:9px 10px 8px;text-decoration:none;color:var(--ink-2);font-size:13.5px;font-weight:500;border-bottom:2.5px solid transparent;margin-bottom:-1px}
nav.main a svg{width:22px;height:22px}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--shu);background:none}
nav.main a:hover{background:none}
nav.main a[aria-current="page"] svg{color:var(--shu)}
.lang{position:relative;margin-left:auto}
.langbtn{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:var(--ink);font-size:14px}
.langbtn svg{width:18px;height:18px}.langbtn b{font-weight:600}.langbtn .caret{font-size:10px;color:var(--ink-2)}
#savedBtn{white-space:nowrap}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;z-index:40}
.langmenu button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer;color:var(--ink)}
.langmenu button:hover{background:var(--ai-soft)}
.langmenu button[aria-checked="true"]{font-weight:700;color:var(--shu)}
.langmenu small{font-size:11.5px;color:var(--ink-2);font-weight:400}
html:lang(ja){--f-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Meiryo",system-ui,sans-serif;--f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif}
.savedbtn{padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500;font-size:14px}
.savedbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.savedbtn .n{min-width:20px;height:20px;border-radius:10px;background:var(--shu);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
@media (min-width:600px){nav.main{display:block}}
@media (max-width:999px){.top nav.main .wrap{overflow-x:auto;scrollbar-width:none;gap:0}.top nav.main .wrap::-webkit-scrollbar{display:none}nav.main a{min-width:62px;padding:8px 6px 7px;font-size:12.5px;flex:1 0 auto;white-space:nowrap}nav.main a svg{width:20px;height:20px}}
@media (max-width:480px){.langbtn{padding:8px 9px}.langbtn .caret{display:none}.top .wrap{gap:10px}}

/* hero */
.hero{padding-block:28px 8px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--shu);font-weight:600}
.hero h1{font-family:var(--f-display);font-size:clamp(26px,4vw,38px);line-height:1.25;margin:6px 0 16px;text-wrap:balance;font-weight:700}
.cities{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cityscroll{position:relative}
.cityscroll[hidden]{display:none}
.cityscroll .cnav{position:absolute;top:0;bottom:4px;width:56px;display:flex;align-items:center;border:0;padding:0;cursor:pointer;z-index:2;background:none}
.cityscroll .cnav[hidden]{display:none}
.cityscroll .cnav.prev{left:0;justify-content:flex-start;background:linear-gradient(90deg,var(--paper) 45%,transparent)}
.cityscroll .cnav.next{right:0;justify-content:flex-end;background:linear-gradient(270deg,var(--paper) 45%,transparent)}
.cityscroll .cnav span{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.cityscroll .cnav:hover span{border-color:var(--ink-2)}
.cityscroll .cnav:focus-visible span{outline:2px solid var(--ai);outline-offset:2px}
.cities::-webkit-scrollbar{display:none}
.city{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px;display:flex;align-items:baseline;gap:6px}
.city .jp{font-family:var(--f-kanji);font-size:12px;color:var(--ink-2)}
html:lang(ja) .city .jp{display:none}
.city[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--paper)}
.city[aria-pressed="true"] .jp{color:inherit;opacity:.75}

.areas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.area{border:1px solid var(--line);background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.area[aria-pressed="true"]{background:var(--shu);border-color:var(--shu);color:#fff;font-weight:600}
.area:hover{border-color:var(--ink-2)}
.regionbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.regionbox h3{margin:0;font-family:var(--f-display);font-size:18px}
.regiongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.morebtn{margin-top:10px}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:16px}
.brief div{background:var(--surface);padding:12px 16px;min-width:0}
.brief dt{font-size:12px;color:var(--ink-2)}
.brief dd{margin:2px 0 0;font-weight:600;font-variant-numeric:tabular-nums}
.brief dd small{font-weight:400;color:var(--ink-2)}

/* section */
main{padding-block:20px 48px}
.sechead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:14px}
.sechead h2{font-family:var(--f-display);font-size:24px;margin:0;font-weight:700}
.sechead p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);background:var(--surface);font-weight:600}
.search{flex:1 1 220px;max-width:320px;margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;transition:transform .15s ease,border-color .15s}
.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.plate{position:relative;aspect-ratio:16/8;max-width:100%;background:color-mix(in srgb,var(--c) 12%,var(--surface));display:grid;place-items:center;overflow:hidden}
.plate .k{color:var(--c);line-height:0;opacity:.9}
.plate .k svg{width:60px;height:60px}
.plate .tag{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--c)}
.plate .where{position:absolute;right:12px;top:10px;font-size:11px;color:var(--ink-2)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.card .jpn{font-family:var(--f-kanji);font-size:12px;color:var(--ink-2)}
.card p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.card .meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink-2)}
.saved-mark{color:var(--shu);font-weight:600}
.empty{padding:40px 16px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:var(--r)}

/* festivals */
.brief .hmsel{grid-column:1/-1;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brief .hmsel button{font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:7px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-2);position:relative}
.brief .hmsel button:hover{border-color:var(--ai);color:var(--ink)}
.brief .hmsel button[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}
.brief .hmsel button.now::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--shu)}
@media (max-width:759px){.brief .hmsel{grid-template-columns:repeat(6,minmax(0,1fr));padding:12px}.brief .hmsel button{font-size:13px;padding:6px 0}}
.months{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));gap:6px;overflow-x:auto;padding-top:12px;padding-bottom:4px;margin-bottom:18px}
.month{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 4px;cursor:pointer;text-align:center;position:relative}
.month b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.month span{font-size:11px;color:var(--ink-2)}
.month[aria-pressed="true"]{background:var(--yamabuki);border-color:var(--yamabuki);color:#1C1A12}
.month[aria-pressed="true"] span{color:inherit}
.month.now::after{content:"이번 달";position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:10px;background:var(--shu);color:#fff;border-radius:4px;padding:0 5px;white-space:nowrap}
.fest{display:grid;grid-template-columns:72px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%}
.fest .stamp{width:72px;height:72px;border-radius:50%;border:2px solid var(--c);color:var(--c);display:grid;place-items:center}

    const chunk = titles.slice(i,i+40);
    const r = await fetch(`${base}?action=query&format=json&formatversion=2&origin=*&redirects=1&${extra}&titles=${encodeURIComponent(chunk.join("|"))}`);
    if(!r.ok) throw new Error("wiki "+r.status);
    out.push((await r.json()).query||{});
  }
  return out;
}
async function pageImages(lang, titles){
  const found = {};
  if(!titles.length) return found;
  for(const q of await wikiBatch(`https://${lang}.wikipedia.org/w/api.php`, titles, "prop=pageimages&piprop=thumbnail|name&pithumbsize=900&pilimit=50")){
    const alias = {}; [...(q.normalized||[]),...(q.redirects||[])].forEach(n=>alias[n.from]=n.to);
    const byTitle = {}; (q.pages||[]).forEach(p=>{ if(p.thumbnail&&p.pageimage) byTitle[p.title]={src:p.thumbnail.source,file:p.pageimage.replace(/_/g," "),page:p.title,lang}; });
    titles.forEach(t=>{ let x=t; for(let k=0;k<4&&alias[x];k++) x=alias[x]; if(byTitle[x]) found[t]=byTitle[x]; });
  }
  return found;
}

async function loadPhotos(){
  try{ const c = JSON.parse(localStorage.getItem(PHOTO_KEY)||"null"); if(c && Date.now()-c.t < 7*864e5){ PHOTO=c.p; render(); return; } }catch(e){}
  try{
    // WIKI 후보 중 "ja:" 로 시작하는 것은 일본어 위키백과 문서
    const wikiAll = Object.values(WIKI).flat();
    const enTitles = [...new Set([...wikiAll.filter(t=>!t.startsWith("ja:")), ...RESTAURANTS.flatMap(dishTitles)])];
    const jaTitles = [...new Set([...wikiAll.filter(t=>t.startsWith("ja:")).map(t=>t.slice(3)), ...RESTAURANTS.flatMap(r=>SHOP_WIKI[r.jp]||[])])];
    const en = await pageImages("en", enTitles);
    let ja = {}; try{ ja = await pageImages("ja", jaTitles); }catch(e){}
    const p = {};
    const wget = t => t.startsWith("ja:") ? ja[t.slice(3)] : en[t];
    Object.entries(WIKI).forEach(([id,ts])=>{ const t=ts.find(wget); if(t) p[id]={...wget(t)}; });
    RESTAURANTS.forEach(r=>{
      const d = dishTitles(r).find(t=>en[t]); if(d) p["dish:"+r.id] = {...en[d]};
      const s = (SHOP_WIKI[r.jp]||[]).find(t=>ja[t]); if(s) p["shop:"+r.id] = {...ja[s]};
    });
    try{
      const files = [...new Set(Object.values(p).map(x=>x.file))].map(f=>"File:"+f);
      const meta = {};
      for(const q of await wikiBatch("https://commons.wikimedia.org/w/api.php", files, "prop=imageinfo&iiprop=extmetadata&iiextmetadatafilter=Artist|LicenseShortName")){
        (q.pages||[]).forEach(pg=>{ const m=pg.imageinfo?.[0]?.extmetadata; if(m) meta[pg.title.replace(/^File:/,"")]={artist:stripTags(m.Artist?.value),license:stripTags(m.LicenseShortName?.value),commons:true}; });
      }
      Object.values(p).forEach(x=>{ if(meta[x.file]) Object.assign(x,meta[x.file]); });
    }catch(e){}
    PHOTO = p;
    try{ localStorage.setItem(PHOTO_KEY, JSON.stringify({t:Date.now(),p})); }catch(e){}
    render();
  }catch(e){ /* 사진을 못 받으면 한자 그래픽·빈 자리를 그대로 보여줌 */ }
}

/* 일본 현재 시각 (JST) */
function jstParts(){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23",weekday:"short"});
  const o = {}; f.formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
  const wd = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[o.weekday];
  return {date:`${o.year}-${o.month}-${o.day}`,hour:o.hour,min:o.minute,dow:DOW[wd],md:`${+o.month}월 ${+o.day}일`};
}

      <text x="${k*CW+CW/2}" y="${y(v)-9}" text-anchor="middle" class="${k===0?"now":""}">${fmt(v)}</text>`).join("")}
  </svg>`;
  const cols = idx.map((i,k)=>{ const hh=h.time[i].slice(11,13); const label = k===0?"지금":hh==="00"?`<span class="tmr">내일</span>`:`${+hh}시`;
    return `<div class="wxcol"><span class="wxi" title="${wmo(h.weather_code[i])}">${wicon(h.weather_code[i])}</span><span class="wxh">${label}</span></div>`; }).join("");
  return `<div class="wxhourly"><div class="wxtabs" role="tablist">${Object.entries(WXTABS).map(([k,v])=>`<button type="button" class="wxtab" role="tab" data-wxtab="${k}" aria-selected="${(st.wxTab||"t")===k}">${v.ko}</button>`).join("")}</div>
    <div class="wxscroll"><div class="wxplot" style="width:${W}px">${svg}<div class="wxcols">${cols}</div></div></div></div>`;
}

/* header pieces */
/* 도시 칩 줄: 넘치면 양옆 화살표로 넘겨 보기 */
function cityArrows(){
  const el=$("#cities"); if(!el) return;
  const max=el.scrollWidth-el.clientWidth;
  $("#cityPrev").hidden = el.scrollLeft<=2;
  $("#cityNext").hidden = el.scrollLeft>=max-2;
}
let cityScrollReady=false;
function cityScrollInit(){
  const el=$("#cities");
  if(!cityScrollReady){
    cityScrollReady=true;
    el.addEventListener("scroll",cityArrows,{passive:true});
    window.addEventListener("resize",cityArrows);
    const go=d=>el.scrollBy({left:d*Math.max(160,el.clientWidth*0.7),behavior:"smooth"});
    $("#cityPrev").addEventListener("click",()=>go(-1));
    $("#cityNext").addEventListener("click",()=>go(1));
  }
  // 고른 도시가 가려져 있으면 보이게
  const on=el.querySelector('[aria-pressed="true"]');
  if(on && (on.offsetLeft<el.scrollLeft || on.offsetLeft+on.offsetWidth>el.scrollLeft+el.clientWidth)){
    el.scrollLeft = Math.max(0, on.offsetLeft - (el.clientWidth-on.offsetWidth)/2);
  }
  requestAnimationFrame(cityArrows);
}

      ...(MONTH_ONLY[M-1]||[]).map(([id,when,desc])=>({x:byId(id),when,desc,tag:"관광지"})).filter(o=>o.x)];
    // 여행하기 좋은 도시와 맞추기: 추천 도시 순서대로 번갈아 하나씩, 최대 3개
    const pickCities = (MONTH_PICKS[M-1]||[]).map(r=>r[0]);
    const groups = pickCities.map(c=>allOnly.filter(o=>o.x.city===c));
    let only = [];
    for(let i=0; only.length<3 && groups.some(g=>g[i]); i++) groups.forEach(g=>{ if(g[i]&&only.length<3) only.push(g[i]); });
    if(!only.length) only = allOnly.slice(0,3);
    const temps = Object.entries(CITIES).map(([k,v])=>{
      const w = live && WX[k];
      if(w){ const c=w.current, d=w.daily||{}; const hu = c.relative_humidity_2m!=null?rnd(c.relative_humidity_2m):(HUM[k]?.[M-1]??"—");
        return `<button type="button" class="tcity" data-city="${k}"><b>${v.ko}</b><span class="ticon">${wicon(c.weather_code)}</span><span class="tavg">${rnd(c.temperature_2m)}°</span><small class="tcond">${wmo(c.weather_code)}</small>${d.temperature_2m_max?`<small class="thl"><i>${rnd(d.temperature_2m_max[0])}°</i> / <u>${rnd(d.temperature_2m_min[0])}°</u></small>`:""}</button>`; }
      return `<button type="button" class="tcity" data-city="${k}"><b>${v.ko}</b><span class="tavg">${v.temp[M-1]}°</span></button>`;
    }).join("");
    $("#brief").innerHTML = `
      <nav class="hmsel" aria-label="월 선택">${Array.from({length:12},(_,i)=>`<button type="button" data-hm="${i+1}"${i+1===M?' aria-pressed="true"':""}${i+1===NOW_M?' class="now"':""}>${i+1}월</button>`).join("")}</nav>
      <div class="bmonth"><dt>${live?`오늘 일본 날씨 <span class="jstclock">${(j=>`${j.md}(${j.dow}) ${j.hour}:${j.min}`)(jstParts())}</span>`:`${M}월 평년기온`}</dt>
        <dd class="tcities">${temps}</dd>
        <dd class="sub">${M!==NOW_M?`${M}월 평년 최고기온(약) · 오늘 날씨는 ${NOW_M}월을 누르면 보여요`:WX?"현재 기온·날씨 · 오늘 최고/최저 (Open-Meteo)":wxFailed?"실시간 날씨를 불러오지 못해 평년 최고기온을 보여드려요":"실시간 날씨를 불러오는 중이에요 · 지금은 평년 최고기온"}</dd></div>
      <div class="bmemo"><dt>${M}월 여행 메모</dt>
        <dd class="mood">${(MONTH_MOOD[M-1]||[]).map(([h,t])=>`<p><span>${esc(h)}</span>${esc(t)}</p>`).join("")}</dd></div>
      <div class="bcity"><dt>여행하기 좋은 도시</dt>
        <ol class="picks">${rec}</ol>
        <dd class="sub">도시를 누르면 관련 관광지·축제로 이동해요</dd></div>
      <div class="bnow"><dt>${M}월에만 즐길 수 있는 것</dt>
        <ol class="picks">${only.map(o=>`<li><button type="button" class="pick" data-open="${o.x.id}"><b><span class="fcity">${cityOf(o.x)}</span>${esc(o.x.name)}<span class="fdate">${esc(o.when)}</span></b><span class="pd fd">${esc(o.desc)}</span></button></li>`).join("")}</ol>
        <dd class="sub">이름을 누르면 자세히 볼 수 있어요</dd></div>`;
  }
  $("#wxnote").textContent = WX ? "날씨: Open-Meteo 실시간 예보 · 30분마다 갱신" : wxFailed ? "실시간 날씨를 불러오지 못해 평년값을 보여드려요." : "실시간 날씨를 불러오는 중…";
}
function setNav(){
  document.querySelectorAll("[data-view]").forEach(a=>{
    if(ROUTED) a.setAttribute("href", window.NT_BASE + LPRE + pathOf({...st, view:a.dataset.view, city:a.dataset.view==="home"?"all":st.city}));
    if(a.classList.contains("brand")) return;
    a.toggleAttribute("aria-current",a.dataset.view===st.view);
    if(a.dataset.view===st.view) a.setAttribute("aria-current","page");
  });
  $("#savedN").textContent = saved.length;
}

/* cards */
function card(it){
  const isSaved = saved.includes(it.id);
  const city = CITIES[it.city];
  const extra = it.type==="rest" ? esc(it.dish) : it.type==="food" ? "¥".repeat(it.price)+"<span style='opacity:.3'>"+"¥".repeat(3-it.price)+"</span>" : esc(it.station||it.area||"");
  const tg = PLACE_TYPES.includes(it.type) ? ["a",` href="${placeHref(it.id)}"`] : ["button",' type="button"'];
  return `<${tg[0]} class="card"${tg[1]} data-open="${it.id}" style="--c:var(${colorOf(it)})">
    <div class="plate"><span class="tag">${esc(tagOf(it))}</span><span class="where">${esc((it.sub&&AREA[it.sub]?.ko)||city.ko)}</span><span class="k">${itemIcon(it)}</span>${imgTag(it.id)}</div>
    <div class="body"><h3>${esc(it.name)}</h3><div class="jpn">${esc(it.jp)}</div><p>${esc(it.desc)}</p>
    <div class="meta"><span>${extra}</span>${isSaved?'<span class="saved-mark">저장됨</span>':''}</div></div></${tg[0]}>`;
}
function chips(map,key,allLabel){
  return (allLabel?`<button class="chip" type="button" data-chip="${key}" data-v="all" aria-pressed="${st[key]==="all"}">${allLabel}</button>`:"")+
    Object.entries(map).map(([k,v])=>`<button class="chip" type="button" data-chip="${key}" data-v="${k}" aria-pressed="${st[key]===k}">${typeof v==="string"?v:v.ko}</button>`).join("");
}
const searchBox = ph => `<input class="search" id="q" type="search" placeholder="${ph}" value="${esc(st.q)}" aria-label="검색">`;
const cityName = () => curArea() ? `${CITIES[st.city].ko} ${curArea().ko}` : (CITIES[st.city]?.ko || "일본 전국");
const gridOr = (items,msg) => items.length ? `<div class="grid">${items.map(card).join("")}</div>` : `<div class="empty">${msg}</div>`;

const regionChooser = count => `<div class="regiongrid">${Object.entries(CITIES).map(([k,c])=>`<div class="regionbox"><h3>${c.ko} <span class="rjp">${c.jp}</span></h3>
  <div class="areas">${areasOf(k).map(a=>{const n=count?count(a.key):null; return `<button class="area" type="button" data-area="${a.key}" data-region="${k}">${a.ko}${n?` <span class="acount">${n}</span>`:""}</button>`;}).join("")}</div></div>`).join("")}</div>`;
/* 이달 추천에서 넘어왔을 때 맨 위에 관련 항목 모아 보기 */
function focusBox(){
  const f = st.focus; if(!f || f.city!==st.city) return "";
  const items = f.ids.map(byId).filter(Boolean); if(!items.length) return "";
  const body = items[0].type==="fest"
    ? `<div class="flist">${items.map(x=>`<a class="fest" href="${placeHref(x.id)}" data-open="${x.id}" style="--c:var(--yamabuki)"><span class="stamp">${SVGI(MICON.fest)}${imgTag(x.id)}</span><span><span class="when">${esc(x.when)} · ${esc(placeOf(x))}</span><h3>${esc(x.name)}</h3><p>${esc(x.desc)}</p></span></a>`).join("")}</div>`
    : `<div class="grid">${items.map(card).join("")}</div>`;
  return `<section class="focusbox"><div class="fhead"><span class="arbadge">${f.m}월 추천</span><h3>${esc(CITIES[f.city].ko)} · ${esc(f.why)}</h3></div>${body}</section>`;
}

const THEME_INTRO = {"spots":{"icon":"⛩️","title":"일본 관광, 이렇게 보면 좋아요","lead":"일본은 오래된 사찰·신사와 성이 도심 곳곳에 남아 있고, 화산·바다·꽃밭 같은 자연이 지역마다 뚜렷하게 달라요. 같은 도시 안에서도 '옛 거리'와 '최신 번화가'가 나란히 있어 하루에 두 시대를 오갈 수 있는 게 매력이에요.","sec":[["사찰과 신사","불교 사찰(○○지·○○데라)은 부처를, 신사(○○진자·○○구)는 일본 고유의 신을 모셔요. 주홍빛 도리이가 보이면 신사예요.",["sensoji","fushimi","kiyomizu","s_todaiji","s_tsurugaoka","s_kinkakuji"]],["성과 옛 거리","전국시대 성과 에도 시대 상점가가 남아 있어 역사 산책을 즐기기 좋아요.",["osakajo","s_nijo","s_goryokaku","shuri","s_ninenzaka","s_naramachi"]],["자연과 풍경","온천 화산, 라벤더 언덕, 에메랄드빛 바다까지 지역마다 풍경이 완전히 달라요.",["s_owakudani","s_tomita","s_aoiike","s_kabira","kouri","arashiyama"]],["도시 야경과 번화가","전망대와 네온 거리는 해 질 무렵부터가 진짜예요.",["shibuya","s_tokyotower","dotonbori","s_harukas","s_hakodateyama","s_minatomirai"]]],"tips":["신사에서는 도리이 앞에서 가볍게 인사하고, 참배 전 데미즈야(손 씻는 곳)에서 손과 입을 헹궈요.","참배는 '두 번 절, 두 번 박수, 한 번 절'이 기본이에요. 사찰에서는 박수를 치지 않아요.","사찰·정원은 대부분 오후 4~5시에 입장을 마감해요. 유명 명소는 개장 직후가 가장 한산해요.","교토 기온 등 일부 골목은 사유지 촬영 금지 구역이 있어요. 안내판을 따라 주세요."]},"festivals":{"icon":"🏮","title":"일본 축제(마쓰리) 이야기","lead":"마쓰리는 지역의 신에게 풍요와 안녕을 비는 행사에서 시작됐어요. 사람들이 가마(미코시)나 거대한 수레를 메고 거리를 행진하고, 길가에는 야타이(노점)가 늘어서요. 계절마다 성격이 달라 여행 시기를 정하는 좋은 기준이 돼요.","sec":[["겨울 · 봄","눈과 얼음 조각, 벚꽃 아래 꽃놀이가 대표적이에요.",["snowfes","hanami","sanja","dontaku"]],["여름","일본 3대 마쓰리 중 두 개(기온·덴진)가 7월에 열리고, 불꽃놀이와 춤 축제가 이어져요.",["gion-m","tenjin-m","yamakasa","sumida","eisa","okuribi"]],["가을 · 겨울","시대 행렬과 단풍, 일루미네이션이 도시를 채워요.",["danjiri","jidai","tsunahiki","momiji","illumi"]]],"tips":["큰 마쓰리 기간엔 숙소가 몇 달 전에 차요. 날짜가 정해지면 바로 예약하세요.","여름 축제엔 유카타(얇은 기모노)를 입은 사람이 많아요. 대여점에서 빌려 입어 보는 것도 좋아요.","행렬 구간은 교통이 통제되고 매우 붐벼요. 주변 역 대신 한두 정거장 떨어진 역을 이용하세요.","야타이는 현금만 받는 곳이 많으니 동전과 천 엔짜리를 챙기세요."]},"food":{"icon":"🍜","title":"일본 음식, 지역마다 달라요","lead":"일본은 지역마다 '명물' 음식이 뚜렷해요. 같은 라멘도 후쿠오카는 진한 돼지뼈(돈코츠), 삿포로는 된장(미소), 도쿄는 간장(쇼유)이 대표예요. 지역에 도착하면 그곳 명물부터 맛보는 게 일본 미식 여행의 정석이에요.","sec":[["꼭 먹어볼 지역 명물","지역을 대표하는 향토음식이에요. 이름을 누르면 설명을 볼 수 있어요.",["hakataramen","misoramen","okonomi","takoyaki","monja","okisoba"]],["시장과 길거리 음식","시장에서 조금씩 사 먹으며 다니는 재미가 있어요.",["tsukiji","kuromon","nishiki","nijo","yatai"]],["맛집 페이지 보는 법","지역을 고르면 라멘·스시·이자카야 등 메뉴별 TOP 5가 나오고, AutoReserve로 예약할 수 있어요. 오코노미야키·타코야키는 구글 지도 링크로 연결돼요.",[]]],"tips":["라멘·덮밥집은 입구 식권 자판기에서 표를 사서 내는 곳이 많아요.","이자카야는 자리에 앉으면 기본 안주 '오토시'가 나오고 자릿세처럼 계산돼요.","일본은 팁 문화가 없어요. 계산은 대부분 자리에서 일어나 계산대에서 해요.","인기 가게는 줄을 서거나 예약이 필요해요. 저녁은 미리 예약하면 편해요."]},"transport":{"icon":"🚆","title":"일본 교통, 이것만 알면 돼요","lead":"일본 여행의 이동은 거의 철도와 지하철로 해결돼요. 공항에서 시내까지 전용 열차가 다니고, 도시 안에서는 IC 교통카드 한 장으로 지하철·버스·편의점 결제까지 할 수 있어요. 도시 사이는 신칸센과 특급 열차가 빠르게 이어 줘요.","sec":[["IC 교통카드","Suica·PASMO(도쿄), ICOCA(오사카), SUGOCA(후쿠오카), Kitaca(홋카이도) 등은 서로 호환돼요. 오키나와 OKICA는 따로 써요. 아이폰 지갑 앱에도 넣을 수 있어요.",[]],["공항 → 시내","도시마다 가장 빠른 공항 열차·버스는 지역을 고른 뒤 상단 '공항에서 가는 법' 칸에서 확인할 수 있어요.",[]],["도시 간 이동","도쿄↔오사카는 신칸센으로 약 2시간 30분, 하카타↔유후인·벳푸는 특급 열차로 2시간 안팎이에요. 오키나와 섬 사이는 비행기를 타요.",[]]],"tips":["출퇴근 시간(오전 7~9시, 오후 5~7시)의 도쿄·오사카 지하철은 매우 붐벼요. 큰 짐이 있다면 피하세요.","택시는 기본요금이 비싼 편이라 짧은 거리나 여럿이 함께일 때만 추천해요.","여러 도시를 오가거나 관광지를 많이 돈다면 지역 패스가 더 저렴할 수 있어요. 일정과 비교해 보세요.","열차 안에서는 통화를 자제하고, 우선석 근처에서는 휴대폰을 무음으로 해요."]},"shopping":{"icon":"🛍️","title":"일본 쇼핑, 알고 사면 더 좋아요","lead":"일본 쇼핑은 백화점·쇼핑몰 같은 큰 곳부터 드럭스토어, 전자상가, 지역 기념품 가게까지 폭이 넓어요. 도시마다 쇼핑 거리가 정해져 있어 한 동네에서 몰아서 사기 좋아요.","sec":[["대표 쇼핑 거리","백화점·패션·전자·서브컬처까지 지역별 대표 거리예요.",["ginza","akiba","harajuku","shinsaibashi","umedadept","canal","tanuki","kokusaishop"]],["면세 제도가 바뀌었어요 (2026년 11월부터)","11월 1일부터는 매장에서 세금을 포함해 계산하고, 출국할 때 공항에서 확인을 받은 뒤 소비세를 돌려받는 '환급 방식'으로 바뀌어요. 같은 가게에서 하루 5,000엔(세금 제외) 이상 사면 대상이에요.",[]]],"tips":["환급을 받으려면 산 물건을 위탁 수하물에 넣지 말고, 출국 심사 전 공항 단말기에서 여권으로 확인을 받아야 해요.","일본에서 먹거나 쓴 식품·화장품은 환급되지 않고, 영수증 한 장에 든 물건 중 하나라도 없으면 그 영수증 전체가 환급되지 않아요.","백화점 지하 식품관(데파치카)은 선물용 과자 사기 좋고, 폐점 1시간 전엔 할인도 많아요.","드럭스토어는 가게마다 가격이 달라요. 같은 거리에서 두세 곳 비교해 보세요."]}};

 saved(){

    : `<div class="empty">아직 저장한 곳이 없어요.<br>관광지·맛집·축제 카드를 열고 <b>나의 여행에 저장</b>을 눌러보세요.</div>`}`;

/* 지도 페이지: 관광지·축제·맛집(AutoReserve 지역별 TOP 10)·쇼핑을 일본 지도에 표시
   좌표는 geo.js (GEO: 항목 id → [위도, 경도], AR_GEO: AutoReserve 가게 번호 → [위도, 경도, 가게 ID])
   지도: MapLibre GL + OpenFreeMap(무료, API 키 없음). 지도 글자는 고른 언어로 보여요 */
const MCAT = {spot:["관광지","--ai"],fest:["축제","--yamabuki"],rest:["맛집","--shu"],shop:["쇼핑","--matsu"]};
const mst = {cats:{spot:true,fest:true,rest:true,shop:true}, m:0, q:"", area:"all", sel:null};
let MAP=null, MAPREADY=false, MITEMS=null, mlistTimer=0, MPOP=null;
function mapItems(){
  if(MITEMS) return MITEMS;
  const G = window.GEO||{}, AG = window.AR_GEO||{}, out=[];
  ALL.forEach(x=>{ if(!MCAT[x.type]||!G[x.id]) return; out.push({id:x.id,cat:x.type,name:x.name,jp:x.jp,city:x.city,sub:x.sub||null,
    sub2: x.type==="fest" ? `${x.when} · ${placeOf(x)}` : (x.area||x.station||""), month:x.month||0, ll:G[x.id]}); });
  const slugArea = {}; Object.entries(window.AR_SLUG||{}).forEach(([a,sl])=>{ if(!slugArea[sl]) slugArea[sl]=a; });
  const seen = new Set();
  Object.entries(window.AR_LISTS||{}).forEach(([sl,l])=>(l.all||[]).forEach(i=>{
    const g = AG[i], r = (window.AR_SHOPS||{})[i]; if(!g||!r||seen.has(i)) return; seen.add(i);
    const ak = slugArea[sl], A = AREA[ak];
    out.push({id:"ar:"+i,cat:"rest",name:r.n,jp:"",city:A?.region||"",sub:ak||null,sub2:[r.dish,r.feat].filter(Boolean).join(" · "),b:r.b||"",ar:g[2],ll:[g[0],g[1]]});
  }));
  return MITEMS=out;
}
function mapFiltered(){
  const T = window.__tr||(x=>x), q = mst.q.trim().toLowerCase();
  return mapItems().filter(x=>mst.cats[x.cat] && (x.cat!=="fest"||!mst.m||x.month===mst.m)
    && (mst.area==="all" || (mst.area.startsWith("c:") ? x.city===mst.area.slice(2) : x.sub===mst.area))
    && (!q || (x.name+" "+x.jp+" "+T(x.name)+" "+x.sub2+" "+T(x.sub2)).toLowerCase().includes(q)));
}
V.map = () => {
  const n = mapItems(), cnt = c => n.filter(x=>x.cat===c).length;
  const regions = Object.entries(CITIES).map(([k,c])=>`<optgroup label="${esc(c.ko)}"><option value="c:${k}">${esc(c.ko)}</option>${areasOf(k).map(a=>`<option value="${a.key}">${esc(a.ko)}</option>`).join("")}</optgroup>`).join("");
  return `<div class="mapwrap" id="mapwrap">
   <div class="mphead"><div class="eyebrow">日本旅行 · 지도</div><h1>지도에서 찾기</h1>
    <p>관광지·축제·맛집·쇼핑 장소를 일본 지도에서 한눈에 보세요. 핀을 누르면 자세한 정보가 열려요.</p>
    <div class="mcats">${Object.entries(MCAT).map(([k,[l,c]])=>`<button type="button" class="mcat" data-mcat="${k}" aria-pressed="${mst.cats[k]}" style="--c:var(${c})"><i></i>${l} <b>${cnt(k)}</b></button>`).join("")}</div>
    <div class="mmonths" id="mmonths"${mst.cats.fest?"":" hidden"}><button type="button" data-mm="0" aria-pressed="${!mst.m}">축제 전체</button>${Array.from({length:12},(_,i)=>`<button type="button" data-mm="${i+1}" aria-pressed="${mst.m===i+1}">${i+1}월</button>`).join("")}</div>
    <div class="mtools"><select id="marea" aria-label="지역 선택"><option value="all">일본 전체</option>${regions}</select><input id="mq" type="search" placeholder="이름으로 찾기" aria-label="검색" value="${esc(mst.q)}"></div>
   </div>
   <div class="mapbox"><div id="mapc"></div><div class="mapmsg" id="mapmsg">지도를 불러오는 중이에요</div>
    <div class="mapnote">위치는 위키백과·국토지리원·AutoReserve 자료 기준이라 실제 입구와 조금 다를 수 있어요.</div></div>
   <div class="mlistwrap"><div class="mlhead"><span>지도에 보이는 곳</span><b id="mln">0</b></div><div class="mlist" id="mlist"></div></div>
  </div>`;
};
function mapListRender(){
  const el = $("#mlist"); if(!el) return;
  let items = mapFiltered();
  if(MAP && MAPREADY){ const b = MAP.getBounds(); items = items.filter(x=>b.contains([x.ll[1],x.ll[0]])); }
  $("#mln").textContent = items.length;
  const shown = items.slice(0,150);
  el.innerHTML = shown.length ? shown.map(x=>`<button type="button" class="mitem${mst.sel===x.id?" on":""}" data-mid="${x.id}" style="--c:var(${MCAT[x.cat][1]})"><i class="dot"></i><div><small>${MCAT[x.cat][0]}${x.sub&&AREA[x.sub]?" · "+esc(AREA[x.sub].ko):""}</small><b>${esc(x.name)}</b>${x.sub2?`<span>${esc(x.sub2)}</span>`:""}</div>${mapThumb(x)}</button>`).join("")
    : `<div class="empty">이 범위에는 표시할 곳이 없어요. 지도를 옮기거나 축소해 보세요.</div>`;
}
/* 목록 오른쪽 작은 사진: 위키미디어 썸네일을 작은 크기(120px)로 받아요. 사진이 없으면 한자 칸 */
const smallImg = src => String(src).replace(/\/(\d+)px-([^/]+)$/, "/120px-$2");
/* 사진이 없을 때 쓰는 그림 (종류별 선 그림) */

function mapThumb(x){
  const ph = PHOTO[x.id], it = x.cat==="spot" ? byId(x.id) : null;
  const key = x.cat==="spot" ? (MICON[it?.cat] ? it.cat : "nature") : x.cat;
  return `<span class="mthumb" aria-hidden="true">${ph?`<img src="${esc(smallImg(ph.src))}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${MICON[key]}</svg>`}</span>`;
}
function mapGeoJSON(){
  return {type:"FeatureCollection",features:mapFiltered().map(x=>({type:"Feature",properties:{id:x.id,cat:x.cat},geometry:{type:"Point",coordinates:[x.ll[1],x.ll[0]]}}))};
}
function mapRefresh(fit){
  mapListRender();
  if(!(MAP&&MAPREADY)) return;
  MAP.getSource("pts")?.setData(mapGeoJSON());
  if(fit) mapFit();
}
function mapFit(){
  const items = mapFiltered(); if(!MAP||!items.length) return;
  if(mst.area==="all" && !mst.q){ MAP.fitBounds([[122.5,24],[146,45.6]],{padding:30,duration:600}); return; }
  let w=180,s=90,e=-180,n=-90; items.forEach(x=>{ w=Math.min(w,x.ll[1]); e=Math.max(e,x.ll[1]); s=Math.min(s,x.ll[0]); n=Math.max(n,x.ll[0]); });
  if(e-w<0.02&&n-s<0.02){ MAP.flyTo({center:[(w+e)/2,(s+n)/2],zoom:15}); return; }
  MAP.fitBounds([[w,s],[e,n]],{padding:60,maxZoom:15,duration:600});
}
function mapPopupHTML(x){
  const c = MCAT[x.cat], L = (window.I18N&&window.I18N.ar)||"ko";
  const gm = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x.ll[0]+","+x.ll[1])}`;
  const acts = x.cat==="rest"
    ? `<a class="pri" href="https://autoreserve.com/${L}/restaurants/${esc(x.ar)}" target="_blank" rel="noopener">AutoReserve에서 보기 ↗</a><a href="${gm}" target="_blank" rel="noopener">구글 지도 ↗</a>`
    : `<button type="button" class="pri" data-open="${x.id}">자세히 보기</button><a href="${gm}" target="_blank" rel="noopener">구글 지도 ↗</a>`;
  return `<div class="mpop" style="--c:var(${c[1]})"><div class="mptop"><div class="mptxt"><small>${c[0]}</small><b>${esc(x.name)}</b>${x.jp?`<div class="jp">${esc(x.jp)}</div>`:""}<p>${esc(x.sub2||"")}${x.b?` · ${esc(x.b)}`:""}</p></div>${mapThumb(x)}</div><div class="acts">${acts}</div></div>`;
}
function mapOpen(id, fly){
  const x = mapItems().find(y=>y.id===id); if(!x||!MAP||!MAPREADY) return;
  mst.sel = id;
  if(fly) MAP.flyTo({center:[x.ll[1],x.ll[0]],zoom:Math.max(MAP.getZoom(),14)});
  MPOP?.remove();
  MPOP = new maplibregl.Popup({offset:12,maxWidth:"280px"}).setLngLat([x.ll[1],x.ll[0]]).setHTML(mapPopupHTML(x)).addTo(MAP);
  document.querySelectorAll(".mitem.on").forEach(e=>e.classList.remove("on"));
  document.querySelector(`.mitem[data-mid="${CSS.escape(id)}"]`)?.classList.add("on");
}
function loadMapLib(){
  if(window.maplibregl) return Promise.resolve();
  return new Promise((ok,no)=>{
    const l=document.createElement("link"); l.rel="stylesheet"; l.href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"; document.head.appendChild(l);
    const s=document.createElement("script"); s.src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"; s.onload=ok; s.onerror=no; document.head.appendChild(s);
  });
}
function mapFail(){ const m=$("#mapmsg"); if(m){ m.hidden=false; m.textContent="지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; } }
function mapMount(){
  const wrap = $("#mapwrap"); if(!wrap) return;
  if(innerWidth>820){ const top = document.querySelector("header.top").getBoundingClientRect().bottom + scrollY; wrap.style.height = Math.max(520, innerHeight - top)+"px"; }
  $("#marea").value = mst.area;
  mapListRender();
  MAPREADY=false;
  loadMapLib().then(()=>{
    if(!document.getElementById("mapc")) return;
    const lang = (window.I18N&&window.I18N.lang)||"ko";
    MAP = new maplibregl.Map({container:"mapc",style:"https://tiles.openfreemap.org/styles/positron",bounds:[[122.5,24],[146,45.6]],fitBoundsOptions:{padding:30},attributionControl:{compact:true},cooperativeGestures:innerWidth<=820});
    MAP.addControl(new maplibregl.NavigationControl({showCompass:false}),"bottom-right");
    MAP.on("load",()=>{
      $("#mapmsg").hidden = true;
      // 지도 글자를 고른 언어로 (없으면 영어, 그다음 현지 이름). 일본어는 현지 이름 그대로
      const nm = lang==="ja" ? ["get","name"] : ["coalesce",["get","name:"+lang],["get","name:en"],["get","name_en"],["get","name"]];
      MAP.getStyle().layers.forEach(l=>{ if(l.type==="symbol" && l.layout && l.layout["text-field"]) try{ MAP.setLayoutProperty(l.id,"text-field",nm); }catch(_){} });
      MAP.addSource("pts",{type:"geojson",data:mapGeoJSON(),cluster:true,clusterRadius:46,clusterMaxZoom:13});
      MAP.addLayer({id:"cl",type:"circle",source:"pts",filter:["has","point_count"],paint:{"circle-color":"#C4452C","circle-opacity":.92,"circle-stroke-color":"#fff","circle-stroke-width":3,
        "circle-radius":["step",["get","point_count"],16,10,20,50,25,150,30]}});
      MAP.addLayer({id:"cln",type:"symbol",source:"pts",filter:["has","point_count"],layout:{"text-field":["get","point_count_abbreviated"],"text-font":["Noto Sans Bold"],"text-size":13,"text-allow-overlap":true},paint:{"text-color":"#fff"}});
      MAP.addLayer({id:"pt",type:"circle",source:"pts",filter:["!",["has","point_count"]],paint:{"circle-radius":7,"circle-stroke-color":"#fff","circle-stroke-width":2,
        "circle-color":["match",["get","cat"],"spot","#23395B","fest","#B8860B","rest","#C4452C","shop","#3E6B48","#555"]}});
      MAP.on("click","cl",e=>{ const f=e.features[0]; MAP.getSource("pts").getClusterExpansionZoom(f.properties.cluster_id).then(z=>MAP.easeTo({center:f.geometry.coordinates,zoom:z})); });
      MAP.on("click","pt",e=>mapOpen(e.features[0].properties.id,false));
      ["cl","pt"].forEach(l=>{ MAP.on("mouseenter",l,()=>MAP.getCanvas().style.cursor="pointer"); MAP.on("mouseleave",l,()=>MAP.getCanvas().style.cursor=""); });
      MAP.on("moveend",()=>{ clearTimeout(mlistTimer); mlistTimer=setTimeout(mapListRender,120); });
      MAPREADY = true;
      if(mst.area!=="all"||mst.q) mapFit(); else mapListRender();
    });
    const m0 = MAP; setTimeout(()=>{ if(MAP===m0 && !MAPREADY) mapFail(); }, 20000);
  }).catch(mapFail);
}
document.addEventListener("click",e=>{
  const c = e.target.closest("[data-mcat]");
  if(c){ const k=c.dataset.mcat; mst.cats[k]=!mst.cats[k]; c.setAttribute("aria-pressed",String(mst.cats[k])); if(k==="fest") $("#mmonths").hidden=!mst.cats.fest; mapRefresh(false); return; }
  const mm = e.target.closest("[data-mm]");
  if(mm){ mst.m=+mm.dataset.mm; document.querySelectorAll("[data-mm]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.mm===mst.m))); mapRefresh(false); return; }
  const it = e.target.closest("[data-mid]");
  if(it){ mapOpen(it.dataset.mid,true); if(innerWidth<=820) $("#mapwrap .mapbox").scrollIntoView({behavior:"smooth",block:"start"}); }
});

const GUIDE = {"page": {"title": "여행 준비", "lead": "일본에 가기 전에 알아 두면 좋은 것들을 모았어요. 규정과 혜택은 바뀔 수 있으니 출발 전에 공식 안내를 한 번 더 확인하세요.", "upd": "2026년 10월 기준"}, "secs": [{"key": "entry", "icon": "passport", "name": "입국 준비", "lead": "비자, Visit Japan Web 등록, 가져가면 안 되는 물건을 확인하세요.", "blocks": [{"type": "list", "only": "ko", "h": "비자", "items": ["대한민국 여권은 관광 목적이면 비자 없이 최대 90일까지 머물 수 있어요.", "여권 유효기간은 머무는 기간보다 길어야 해요. 항공사마다 기준이 다를 수 있으니 6개월 이상 남아 있으면 안심이에요.", "입국 심사에서 돌아가는 항공권이나 숙소를 물어볼 수 있어요. 예약 확인 화면을 휴대폰에 저장해 두세요.", "일본은 사전 입국 허가 제도(JESTA)를 준비하고 있지만 아직 시행 전이에요."]}, {"type": "list", "only": "other", "h": "비자", "items": ["많은 나라 여권은 짧은 관광이면 비자 없이 일본에 갈 수 있어요(대개 최대 90일). 내 여권이 해당되는지 일본 외무성 안내에서 확인하세요.", "여권 유효기간은 머무는 기간보다 길어야 해요. 항공사마다 기준이 다를 수 있으니 6개월 이상 남아 있으면 안심이에요.", "입국 심사에서 돌아가는 항공권이나 숙소를 물어볼 수 있어요. 예약 확인 화면을 휴대폰에 저장해 두세요.", "일본은 사전 입국 허가 제도(JESTA)를 준비하고 있지만 아직 시행 전이에요."]}, {"type": "steps", "h": "Visit Japan Web 등록 방법", "sub": "입국 심사와 세관 신고를 미리 온라인으로 해 두는 일본 정부 서비스예요. 공항에서 줄 서는 시간이 줄어요.", "items": ["Visit Japan Web 사이트(앱 아님)에 들어가 이메일로 계정을 만들어요.", "본인 정보에 여권을 등록해요. 휴대폰 카메라로 여권을 읽거나 직접 입력하고, 영문 이름은 여권과 똑같이 써요.", "'입국·귀국 예정 등록'에서 도착 날짜, 항공편명, 일본 숙소 주소와 전화번호를 넣어요.", "'외국인 입국 기록'과 '세관 신고'를 각각 작성해요.", "QR 코드가 나오면 캡처해 두세요. 공항에서 인터넷이 안 될 때도 보여줄 수 있어요.", "가족은 한 계정에 함께 등록할 수 있지만, QR 코드는 사람마다 따로 나와요."], "tips": ["하네다·나리타·간사이 같은 큰 공항은 키오스크에서 여권과 QR 코드를 한 번에 읽어요. 작은 공항은 입국 심사대와 세관에서 QR 코드를 따로 보여줘요.", "한 번 등록한 정보는 다음 여행 때 다시 쓸 수 있어요. 휴대폰보다 컴퓨터로 입력하면 실수가 적어요."]}, {"type": "warn", "h": "가져가면 안 되는 물건", "items": ["고기 제품은 가공품도 안 돼요. 육포, 햄, 소시지, 베이컨, 고기만두 등이 해당되고, 개인용이나 선물이어도 마찬가지예요.", "검사 없이 고기 제품을 들여오면 3년 이하 징역이나 300만 엔 이하 벌금을 받을 수 있어요.", "생과일·생채소와 흙이 묻은 식물은 식물 검역 대상이고, 반입이 금지된 품목이 많아요. 가져가지 않는 게 안전해요.", "일반 의약품은 2개월분, 처방약은 1개월분까지는 따로 서류 없이 가져갈 수 있어요(규제 성분이 없을 때).", "슈도에페드린 같은 각성제 원료가 들어간 일부 감기약·코막힘약과 ADHD 약(애더럴 등)은 반입할 수 없거나 사전 허가가 필요해요. 성분표를 꼭 확인하세요.", "처방약은 원래 포장째 가져가고, 처방전 사본이나 영문 소견서를 함께 챙기세요.", "마약·대마는 물론, CBD 제품도 성분 기준이 엄격하니 가져가지 마세요. 위조품·불법 복제품과 총포·도검도 반입 금지예요."], "foot": "면세 범위는 술 3병(1병 V.guide = function(){

  const sec = GUIDE.secs.find(s=>s.key===st.gsec) || GUIDE.secs[0];
  const blocks = sec.blocks.filter(b=>!b.only || (b.only==="ko")===isKo);
  const tabs = GUIDE.secs.map(s=>`<a class="gtab" href="${gsecHref(s.key)}" data-gsec="${s.key}"${s.key===sec.key?' aria-current="page"':""}>${gsvg(s.icon)}<span>${esc(s.name)}</span></a>`).join("");
  return `<div class="guide">
   <div class="ghead"><h2>${esc(GUIDE.page.title)}</h2><p>${esc(GUIDE.page.lead)}</p></div>
   <nav class="gtabs" aria-label="${esc(GUIDE.page.title)}">${tabs}</nav>
   <section class="gsec"><div class="gsech"><span class="gsi">${gsvg(sec.icon)}</span><div><h3>${esc(sec.name)}</h3><p>${esc(sec.lead)}</p></div></div>

  </div>`;
};

const ROUTED = !!window.NT_BASE;

function pathOf(s){
  if(s.view==="home") return "";
  if(INFO_VIEWS.includes(s.view)) return s.view+"/";
  if(s.view==="saved") return "saved/";
  if(s.view==="place") return `place/${placeSlug(s.place||"")}/`;
  if(s.view==="map") return "map/";
  if(s.view==="itin") return IKEYS.includes(s.itin) ? `itinerary/${s.itin}/` : "itinerary/";
  if(s.view==="guide") return `guide/${GKEYS.includes(s.gsec)?s.gsec:"entry"}/`;
  if(s.city==="all") return s.view==="festivals" ? `festivals/${s.month}/` : s.view+"/";
  return `${s.city}/${s.area}/${s.view}/`;
}
function readPath(){
  const b = window.NT_BASE, lp = location.pathname;
  let p = lp.toLowerCase().startsWith(b.toLowerCase()) ? lp.slice(b.length) : lp.replace(/^\//,"");
  p = p.replace(/^(en|ja|es|fr)(\/|$)/,"");
  const seg = p.split("/").filter(Boolean).map(decodeURIComponent);
  st.view="home"; st.city="all"; st.area="all";
  if(!seg.length) return;
  if(seg[0]==="saved"){ st.view="saved"; return; }
  if(seg[0]==="place"){ const id=placeIdOf(seg[1]||""); if(id){ st.view="place"; st.place=id; } return; }
  if(seg[0]==="map"){ st.view="map"; return; }
  if(seg[0]==="itinerary"){ st.view="itin"; st.itin=IKEYS.includes(seg[1])?seg[1]:""; return; }
  if(seg[0]==="guide"){ st.view="guide"; st.gsec=GKEYS.includes(seg[1])?seg[1]:"entry"; return; }
  if(VIEWS.includes(seg[0])){ st.view=seg[0]; if(seg[0]==="festivals"&&+seg[1]>=1&&+seg[1]<=12) st.month=+seg[1]; return; }
  if(CITIES[seg[0]]){ st.city=seg[0]; st.area=seg[1]||"all"; st.view=VIEWS.includes(seg[2])&&!["home","saved","map","guide","itin","place","about","contact","privacy"].includes(seg[2])?seg[2]:"spots"; }
}

   <dl class="facts">${facts.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)}</dd>`).join("")}${si?si.rows.map(([k,v])=>`<dt>${{fee:"입장료",hours:"운영 시간",closed:"휴무",status:"현재 상태"}[k]}</dt><dd class="si${k==="status"?" warn":""}">${v.map(x=>`<span>${esc(x)}</span>`).join("")}</dd>`).join(""):""}</dl>
   ${si?`${si.note?`<p class="sinote">${esc(si.note)}</p>`:""}<p class="sisrc">2026년 10월 기준 · 요금과 시간은 바뀔 수 있으니 방문 전에 공식 사이트에서 확인하세요.</p>`:""}
   ${SHOP_PICKS[it.id]&&it.type==="shop"?`<div class="picks2"><b>추천 쇼핑 목록</b><ul>${SHOP_PICKS[it.id].map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
   ${it.tip?`<div class="tip"><b>여행 팁</b> · ${esc(it.tip)}</div>`:""}
   ${it.type==="rest"?`<p class="credit">별점과 리뷰는 아래 링크에서 확인하세요. 영업시간·휴무일도 방문 전에 확인하는 게 좋아요.</p>`:""}
   <div class="actions"><button class="btn${isSaved?"":" primary"}" type="button" data-psave="${it.id}">${isSaved?"나의 여행에서 빼기":"나의 여행에 저장"}</button>
   <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${mq}" target="_blank" rel="noopener">${it.type==="rest"?"Google 지도 평점 ↗":"지도에서 보기 ↗"}</a>
   ${inDrawer&&ROUTED&&PLACE_TYPES.includes(it.type)?`<a class="btn" href="${placeHref(it.id)}">장소 페이지<i> →</i></a>`:""}
</div>
   ${it.type!=="rest"&&PHOTO[it.id]?`<div class="credit">사진:${esc(PHOTO[it.id].artist||"저작자 정보는 원본 참고")}${PHOTO[it.id].license?" · "+esc(PHOTO[it.id].license):""} · <a href="${PHOTO[it.id].lang==="ja"&&!PHOTO[it.id].commons?"https://ja.wikipedia.org/wiki/File:":"https://commons.wikimedia.org/wiki/File:"}${encodeURIComponent(PHOTO[it.id].file.replace(/ /g,"_"))}" target="_blank" rel="noopener">사진 원본 ↗</a></div>`:""}`;
}

function infoHref(v){ return ROUTED ? ` href="${window.NT_BASE + LPRE + v + "/"}"` : ` href="#${v}"`; }
V.place = function(){

  const near = [...new Set([...pool.filter(x=>x.sub===it.sub && x.type===it.type), ...pool.filter(x=>x.sub===it.sub && x.type!==it.type), ...pool.filter(x=>x.type===it.type)])].slice(0,8);

   <div class="pl-grid">${plateHTML(it)}<div class="pl-main">${detailHTML(it,"h1")}</div></div>

function openItem(id){
  const it = byId(id); if(!it) return;
  lastFocus=document.activeElement;
  $("#drawer").innerHTML = `<button class="close" type="button" id="closeD" aria-label="닫기">×</button>
   ${it.type==="rest" ? restGallery(it) : plateHTML(it)}
   <div class="in">${detailHTML(it,"h2",true)}</div>`;
  $("#drawer").hidden=false; $("#scrim").hidden=false;
  $("#closeD").focus();
  $("#closeD").onclick=closeItem;
}
function closeItem(){ $("#drawer").hidden=true; $("#scrim").hidden=true; if(lastFocus&&lastFocus.focus) lastFocus.focus(); }
$("#scrim").onclick=closeItem;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#drawer").hidden) closeItem()});

/* events */
document.addEventListener("click",e=>{
  // 이달 추천 도시: 관련 하위 지역·페이지로 이동하고 추천 항목을 맨 위에 보여줌
  const rc = e.target.closest("[data-rec]");
  if(rc){ const [k,why,t] = (MONTH_PICKS[(st.hm||NOW_M)-1]||[])[+rc.dataset.rec]||[]; if(k){ st.city=k; st.area=t.area||"all"; st.view=t.view||"spots"; if(t.month) st.month=t.month; st.focus={ids:t.ids||[],why,city:k,m:st.hm||NOW_M}; st.more=false; if(!ROUTED){ try{history.replaceState(null,"","#"+st.view)}catch(_){} } render(); window.scrollTo({top:0}); } return; }
  if(e.target.closest("[data-city],[data-area],[data-view],[data-chip],[data-month]")) st.focus=null;
  const itc = e.target.closest("[data-itin]"); if(itc){ e.preventDefault(); st.itin=itc.dataset.itin; st.view="itin"; render(); window.scrollTo({top:0}); return; }
  const gs = e.target.closest("[data-gsec]"); if(gs){ e.preventDefault(); st.gsec=gs.dataset.gsec; st.view="guide"; render(); window.scrollTo({top:0}); return; }
  const v = e.target.closest("[data-view]");
  if(v){ e.preventDefault(); if(v.dataset.view==="itin") st.itin=""; go(v.dataset.view); return; }
  const hmb = e.target.closest("[data-hm]"); if(hmb){ st.hm=+hmb.dataset.hm; renderCities(); return; }
  const ht = e.target.closest("[data-hometo]"); if(ht){ st.homeTo=ht.dataset.hometo; render(); return; }
  const ga = e.target.closest("[data-goarea]");
  if(ga){ st.city=ga.dataset.region; st.area=ga.dataset.goarea; st.focus=null; st.more=false; go(ga.dataset.to||st.homeTo); return; }
  const hc = e.target.closest("[data-city]");
  if(hc && st.view==="home" && hc.dataset.city!=="all"){ st.city=hc.dataset.city; st.area="all"; st.focus=null; go(st.homeTo); return; }
  const c = e.target.closest("[data-city]"); if(c){ st.city=c.dataset.city; st.area="all"; st.more=false; render(); return; }
  const ar = e.target.closest("[data-area]"); if(ar){ if(ar.dataset.region) st.city=ar.dataset.region; st.area=ar.dataset.area; st.more=false; render(); if(ar.dataset.region || st.view==="food") window.scrollTo({top:0}); return; }
  if(e.target.closest("#moreBtn")){ st.more=!st.more; render(); return; }
  const wt = e.target.closest("[data-wxtab]"); if(wt){ st.wxTab = wt.dataset.wxtab; renderCities(); return; }
  const ch = e.target.closest("[data-chip]"); if(ch){ st[ch.dataset.chip]=ch.dataset.v; render(); return; }
  const m = e.target.closest("[data-month]"); if(m){ st.month=+m.dataset.month; render(); return; }
  const ps = e.target.closest("[data-psave]"); if(ps){ const id=ps.dataset.psave; saved = saved.includes(id)? saved.filter(x=>x!==id) : [...saved,id]; persist(); const dOpen=!$("#drawer").hidden; render(); if(dOpen) openItem(id); return; }
  const o = e.target.closest("[data-open]"); if(o){ if(o.tagName==="A" && (e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)) return; e.preventDefault(); openItem(o.dataset.open); return; }
});
$("#savedBtn").onclick=()=>go("saved");
/* 언어 선택 — 고르면 저장하고 새로고침해서 그 언어 사전으로 다시 그려요 */
const LANGS=[["ko","KR","한국어"],["en","EN","English"],["ja","JP","日本語"],["es","ES","Español"],["fr","FR","Français"]];
let LANG=(window.I18N&&window.I18N.lang)||"ko";
function renderLang(){
  const cur=LANGS.find(l=>l[0]===LANG)||LANGS[0]; $("#langCode").textContent=cur[1]; document.documentElement.lang=LANG;
  $("#langMenu").innerHTML=LANGS.map(([k,code,name])=>`<button type="button" role="menuitemradio" class="notranslate" lang="${k}" data-lang="${k}" aria-checked="${k===LANG}">${name}<small>${k===LANG?"✓":""}</small></button>`).join("");
}
renderLang();
$("#langBtn").onclick=e=>{ e.stopPropagation(); const m=$("#langMenu"); m.hidden=!m.hidden; $("#langBtn").setAttribute("aria-expanded",String(!m.hidden)); };
$("#langMenu").onclick=e=>{ e.stopPropagation(); const b=e.target.closest("[data-lang]"); if(!b) return; $("#langMenu").hidden=true; if(b.dataset.lang===LANG) return; try{localStorage.setItem("tabishiori-lang",b.dataset.lang)}catch(_){} if(ROUTED){ location.href = window.NT_BASE + (b.dataset.lang==="ko"?"":b.dataset.lang+"/") + pathOf(st); return; } const u=new URL(location.href); u.searchParams.set("lang",b.dataset.lang); location.replace(u.toString()); };
document.addEventListener("click",()=>{ if(!$("#langMenu").hidden){ $("#langMenu").hidden=true; $("#langBtn").setAttribute("aria-expanded","false"); } });
function go(view){
  if(!VIEWS.includes(view)) view="spots";
  st.view=view; st.q="";
  if(view==="home" || INFO_VIEWS.includes(view)){ st.city="all"; st.area="all"; st.focus=null; }
  if(!ROUTED){ try{history.replaceState(null,"","#"+view)}catch(e){} }
  render(); window.scrollTo({top:0});
}
if(ROUTED) readPath();
else { const h = (location.hash||"").slice(1); if(VIEWS.includes(h)) st.view=h; }

if(ROUTED) try{ history.replaceState(null,"",window.NT_BASE + LPRE + pathOf(st)); }catch(_){}
loadWeather(); setInterval(loadWeather, 30*60*1000);
loadPhotos();
